<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main>
  <h1>Login</h1>
  <div class="flash err" th:if="${error}" th:text="${error}"></div>
  <form th:action="@{/login}" method="post" class="card" style="max-width:420px;padding:1.25rem;">
    <div class="row">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="username"/>
    </div>
    <div class="row">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password"/>
    </div>
    <button class="btn" type="submit">Sign in</button>
    <p class="meta" style="margin-top:1rem;">No account? <a th:href="@{/register}">Register</a></p>
  </form>
</main>
</body>
</html>
