<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${isEdit} ? 'Edit category' : 'New category'">Category</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main>
  <h1 th:text="${isEdit} ? 'Edit category' : 'New category'">Category</h1>
  <p class="meta"><a th:href="@{/app/admin/categories}">← Back</a></p>

  <form th:if="${!isEdit}" th:action="@{/app/admin/categories}" th:object="${categoryForm}" method="post" class="card" style="max-width:480px;padding:1.25rem;">
    <div class="row">
      <label>Name</label>
      <input type="text" th:field="*{name}" required/>
    </div>
    <div class="row">
      <label>Description</label>
      <textarea th:field="*{description}" rows="3" required></textarea>
    </div>
    <button class="btn" type="submit">Create</button>
  </form>

  <form th:if="${isEdit}" th:action="@{/app/admin/categories/{id}(id=${editId})}" th:object="${categoryForm}" method="post" class="card" style="max-width:480px;padding:1.25rem;">
    <div class="row">
      <label>Name</label>
      <input type="text" th:field="*{name}" required/>
    </div>
    <div class="row">
      <label>Description</label>
      <textarea th:field="*{description}" rows="3" required></textarea>
    </div>
    <button class="btn" type="submit">Update</button>
  </form>
</main>
</body>
</html>
