<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>All Orders</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main>
  <h1>All orders</h1>
  <div class="flash ok" th:if="${message}" th:text="${message}"></div>
  <div class="flash err" th:if="${error}" th:text="${error}"></div>

  <div class="table-wrap" th:if="${!orders.isEmpty()}">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>User</th>
        <th>Email</th>
        <th>Total</th>
        <th>Status</th>
        <th>Created</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="o : ${orders.content}">
        <td th:text="${o.id}"></td>
        <td th:text="${o.userFullName}"></td>
        <td th:text="${o.userEmail}"></td>
        <td th:text="${o.totalAmount}"></td>
        <td th:text="${o.status}"></td>
        <td th:text="${o.createdAt}"></td>
      </tr>
      </tbody>
    </table>
  </div>
  <p class="meta" th:if="${orders.isEmpty()}">No orders found.</p>
</main>
</body>
</html>
