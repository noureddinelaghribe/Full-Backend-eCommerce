# ═══════════════════════════════════════════════════════════════════
# 🚀 ملف إعدادات Spring Boot الرئيسي
# ═══════════════════════════════════════════════════════════════════
# الوصف:
# - يحتوي على جميع إعدادات التطبيق
# - يتم تحميله تلقائياً عند تشغيل التطبيق
# - يمكن استخدام ملفات مختلفة للبيئات المختلفة (dev, prod, test)
# ═══════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────
# 📝 إعدادات التطبيق الأساسية
# ───────────────────────────────────────────────────────────────────

# 🏷️ اسم التطبيق (يظهر في Logs والمراقبة)
spring.application.name=full-auth-and-jwt

# 🔌 رقم المنفذ الذي سيعمل عليه السيرفر
# الافتراضي: 8080
# يمكن الوصول للتطبيق عبر: http://localhost:1521
server.port=1234

# ───────────────────────────────────────────────────────────────────
# 🗄️ إعدادات قاعدة البيانات MySQL
# ───────────────────────────────────────────────────────────────────

# 🔗 رابط الاتصال بقاعدة البيانات
# الصيغة: jdbc:mysql://[host]:[port]/[database_name]?[parameters]
# - localhost:3306 -> السيرفر والمنفذ
# - ecommerce_db -> اسم قاعدة البيانات
# - useSSL=false -> تعطيل SSL (للتطوير فقط)
# - serverTimezone=UTC -> تحديد المنطقة الزمنية
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC

# 👤 اسم المستخدم للاتصال بقاعدة البيانات
spring.datasource.username=root

# 🔐 كلمة المرور للاتصال بقاعدة البيانات
# ⚠️ تحذير: لا تضع كلمات مرور حقيقية في الكود!
# ⚠️ استخدم Environment Variables في الإنتاج
spring.datasource.password=123456

# 🚗 تعريف Driver الخاص بـ MySQL
# يستخدم لإنشاء الاتصال بقاعدة البيانات
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ───────────────────────────────────────────────────────────────────
# 📊 إعدادات JPA / Hibernate
# ───────────────────────────────────────────────────────────────────

# 🏗️ استراتيجية إدارة الجداول
# الخيارات:
# - none: لا شيء (يجب إنشاء الجداول يدوياً)
# - validate: التحقق من مطابقة الجداول للكلاسات (لا يعدل شيء)
# - update: تحديث الجداول تلقائياً (يضيف أعمدة جديدة، لا يحذف)
# - create: إنشاء الجداول من جديد (يحذف البيانات القديمة!)
# - create-drop: إنشاء عند التشغيل وحذف عند الإيقاف
# 💡 للتطوير: استخدم update
# 💡 للإنتاج: استخدم validate أو none
spring.jpa.hibernate.ddl-auto=update

# 📺 عرض استعلامات SQL في Console
# true: يطبع جميع الاستعلامات (مفيد للتطوير والتتبع)
# false: لا يطبع شيء (أفضل للإنتاج)
spring.jpa.show-sql=true

# ───────────────────────────────────────────────────────────────────
# 📝 إعدادات إضافية (اختيارية)
# ───────────────────────────────────────────────────────────────────

# 🎨 تنسيق SQL المعروض في Console (اختياري)
# spring.jpa.properties.hibernate.format_sql=true

# 📊 عرض معلومات إضافية عن الاستعلامات (اختياري)
# spring.jpa.properties.hibernate.use_sql_comments=true

# 🔍 إعدادات Logging (اختياري)
# logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 🔍 Logging للمصادقة والأمان - Authentication & Security Logging
logging.level.com.example.full.auth.and.jwt=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ═══════════════════════════════════════════════════════════════════
# 📌 ملاحظات مهمة:
# ═══════════════════════════════════════════════════════════════════
# 1. لا تضع معلومات حساسة (كلمات مرور) في هذا الملف في الإنتاج
# 2. استخدم Environment Variables للبيانات الحساسة
# 3. يمكن إنشاء ملفات متعددة مثل:
#    - application-dev.properties (للتطوير)
#    - application-prod.properties (للإنتاج)
#    - application-test.properties (للاختبارات)
# 4. تأكد من وجود MySQL وتشغيله قبل تشغيل التطبيق
# 5. تأكد من إنشاء قاعدة البيانات ecommerce_db يدوياً
# ═══════════════════════════════════════════════════════════════════




